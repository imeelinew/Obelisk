name: Obelisk
options:
  bundleIdPrefix: local.elidev
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
targets:
  ObeliskCore:
    type: framework
    platform: macOS
    sources:
      - path: Sources/ObeliskCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.elidev.ObeliskCore
        PRODUCT_NAME: ObeliskCore
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 5Q5QT76MJU

  Obelisk:
    type: application
    platform: macOS
    sources:
      - path: Sources/ObeliskMenu
      - path: icon/Obelisk.icon
    dependencies:
      - target: ObeliskCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.elidev.Obelisk
        PRODUCT_NAME: Obelisk
        ASSETCATALOG_COMPILER_APPICON_NAME: Obelisk
        MARKETING_VERSION: 1.3.5
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Obelisk
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSAppleEventsUsageDescription: Obelisk uses AppleScript to read the URL and title of the active tab from your frontmost browser when you press the global add-bookmark shortcut.
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 5Q5QT76MJU
        CODE_SIGN_ENTITLEMENTS: Obelisk.entitlements
    scheme:
      testTargets: []

  ObeliskSmokeTests:
    type: tool
    platform: macOS
    sources:
      - path: Sources/ObeliskSmokeTests
    dependencies:
      - target: ObeliskCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.elidev.ObeliskSmokeTests
        PRODUCT_NAME: ObeliskSmokeTests
